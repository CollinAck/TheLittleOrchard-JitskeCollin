<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Little Orchard — More apples ≠ more profit</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="book-desktop.css">

  <meta name="author" content="Jitske en Collin">
  <meta name="description" content="Klik op dit bericht om de interactieve visualisatie te bekijken.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Little Orchard">
  <meta name="twitter:description" content="Klik op dit bericht om de interactieve visualisatie te bekijken.">
  <meta name="twitter:image" content="https://CollinAck.github.io/TheLittleOrchard-JitskeCollin/img/logo-the-little-orchard.png">

</head>
<body>
  <main>
    <div class="orchard-book-shell" aria-label="Open book with year pages">
      <div class="orchard-fixed-paper" aria-hidden="true"></div>
      <section class="horizontal-story" id="horizontalStory" aria-label="The Little Orchard timeline">
        <div class="horizontal-track" id="horizontalTrack"></div>
      </section>
      <div class="orchard-book-cover" aria-hidden="true">
        <span class="orchard-sheet-edge orchard-sheet-edge-top"></span>
        <span class="orchard-sheet-edge orchard-sheet-edge-bottom"></span>
      </div>
      <div class="orchard-book-spine-fixed" aria-hidden="true"></div>
    </div>
  </main>

  <section class="ranking-section" aria-label="Ranking and comparison">
    <div class="ranking-inner">
      <div class="analysis-carousel">
        <div class="analysis-view is-active">
          <div class="analysis-section-heading analysis-logo-heading">
            <div class="analysis-logo-stack">
              <img class="analysis-wordmark" src="img/logo-the-little-orchard.png" alt="The Little Orchard">
            </div>
          </div>

          <div class="ranking-feature-grid ranking-feature-grid-extended">

            <div class="top3-column">
              <div class="podium-shell">
                <div class="podium-grid" id="podiumGrid"></div>
              </div>
              <div class="compare-shell">
                <div class="compare-grid" id="compareGrid"></div>
              </div>
              <div class="remaining-ranks" id="remainingRanks"></div>
            </div>

            <aside class="variety-column" aria-label="Apple varieties">
              <h2 class="apple-ranking-title">Ranking op basis van tonnen</h2>
              <div class="best-varieties" id="bestVarieties"></div>
            </aside>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/excel-reader.js"></script>
  <script src="js/start.js"></script>
</body>
</html>
